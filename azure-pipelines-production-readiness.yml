trigger:
  branches:
    include:
      - main
      - master

pool:
  name: default

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: Use Node.js 22

  - script: |
      yarn install --frozen-lockfile
      yarn type:check
      yarn build
    workingDirectory: $(Build.SourcesDirectory)/front-src-2
    env:
      TSC_COMPILE_ON_ERROR: 'false'
    displayName: Build driver app

  - script: |
      npm ci
      npm run build
    workingDirectory: $(Build.SourcesDirectory)/tire-store-admin
    displayName: Build admin panel

  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 8.0.x
    displayName: Use .NET 8 SDK

  - script: |
      dotnet restore TireStore.sln
      dotnet build TireStore.sln --no-restore --configuration Release
    workingDirectory: $(Build.SourcesDirectory)/tire-store-api
    displayName: Build API solution
